
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroHub | Add Product</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        h2 {
            text-align: center;
            color: #2563eb;
        }

        input, textarea, button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #message {
            text-align: center;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>ElectroHub</h2>
    <h3>Add a Product</h3>

    <form id="product-form">
        <input id="name" placeholder="Product name" required>

        <textarea id="description"
                  placeholder="Product description" required></textarea>

        <input id="price" type="number"
               placeholder="Price in pesos" min="0.01"
               step="0.01" required>

        <input id="stock" type="number"
               placeholder="Available stock" min="0"
               step="1" required>

        <input id="image_url" type="url"
               placeholder="Product image URL (optional)">

        <button type="submit">Add Product</button>
    </form>

    <p id="message"></p>
</div>

<script>
    document.getElementById("product-form")
        .addEventListener("submit", async function(event) {
            event.preventDefault();

            const product = {
                name: document.getElementById("name").value,
                description: document.getElementById("description").value,
                price: document.getElementById("price").value,
                stock: document.getElementById("stock").value,
                image_url: document.getElementById("image_url").value
            };

            const message = document.getElementById("message");
            message.textContent = "Submitting product...";

            try {
                const response = await fetch(
                    "http://127.0.0.1:8000/api/products/create/",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "include",
                        body: JSON.stringify(product)
                    }
                );

                const result = await response.json();

                message.textContent = result.message ||
                    result.detail ||
                    result.error ||
                    (response.ok
                        ? "Product added successfully!"
                        : "Could not add product.");
            } catch (error) {
                message.textContent =
                    "Connection failed. Check that Django is running.";
            }
        });
</script>
</body>
</html>
